<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDU-SMART · Overview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="es-app">
    <aside class="es-sidebar" id="esSidebar"></aside>
    <div class="es-sidebar-backdrop" id="esBackdrop"></div>
    <div class="es-main">
      <header class="es-topbar" id="esTopbar"></header>
      <main class="es-content" id="content">
        <!-- Hero -->
        <section class="es-module-hero hero-primary es-fade-in">
          <div class="es-hero-icon"><i class="bi bi-mortarboard-fill"></i></div>
          <h1 id="greeting">Welcome back</h1>
          <p id="greetingSub">Here's your academic day across all four modules.</p>
        </section>

        <!-- Four module quick-access cards -->
        <div class="row g-3" id="moduleCards"></div>

        <div class="row g-3 mt-1">
          <!-- Left column -->
          <div class="col-lg-8">
            <div class="es-card mb-3">
              <div class="es-card-title"><i class="bi bi-lightning-charge-fill"></i> Your day at a glance</div>
              <div class="row g-3" id="glanceRow"></div>
            </div>
            <div class="es-card">
              <div class="es-card-title"><i class="bi bi-diagram-3-fill"></i> How your modules work together</div>
              <div id="integrationFlow"></div>
            </div>
          </div>
          <!-- Right column -->
          <div class="col-lg-4">
            <div class="es-card mb-3">
              <div class="es-card-title"><i class="bi bi-calendar-event-fill"></i> Upcoming academic dates</div>
              <div id="upcomingDates"></div>
            </div>
            <div class="es-card">
              <div class="es-card-title"><i class="bi bi-bell-fill"></i> Smart notifications</div>
              <div id="notifList"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
