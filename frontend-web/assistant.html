<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcadeAlert · Academic Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="es-app">
    <aside class="es-sidebar" id="esSidebar"></aside>
    <div class="es-sidebar-backdrop" id="esBackdrop"></div>
    <div class="es-main">
      <header class="es-topbar" id="esTopbar"></header>
      <main class="es-content">

        <section class="es-module-hero hero-assistant es-fade-in">
          <div class="es-hero-icon"><i class="bi bi-robot"></i></div>
          <h1>Academic Assistant Dashboard</h1>
          <p>Ask questions and get answers grounded in official university documents.</p>
        </section>

        <div class="row g-3">
          <!-- Chatbot -->
          <div class="col-lg-7">
            <div class="es-card h-100">
              <div class="d-flex align-items-center mb-2">
                <div class="es-card-title mb-0 me-auto"><i class="bi bi-chat-dots-fill"></i> Ask Academic Assistant</div>
                <button class="es-icon-btn" style="width:34px;height:34px" id="clearChat" title="Clear conversation"><i class="bi bi-trash"></i></button>
              </div>
              <div class="es-chat mb-2" id="chatBox"></div>
              <div class="d-flex flex-wrap gap-2 mb-2" id="suggestions"></div>
              <form class="d-flex gap-2" id="chatForm">
                <input class="es-input" id="chatInput" placeholder="e.g. What is the project submission deadline?" autocomplete="off" />
                <button class="btn-es-primary" type="submit"><i class="bi bi-send-fill"></i></button>
              </form>
            </div>
          </div>

          <!-- Right column -->
          <div class="col-lg-5">
            <div class="es-card mb-3">
              <div class="es-card-title"><i class="bi bi-database-fill"></i> Knowledge Base</div>
              <div class="row g-2 text-center" id="kbStats"></div>
              <div class="es-divider"></div>
              <div style="position:relative">
                <i class="bi bi-search" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--es-text-muted)"></i>
                <input class="es-input" id="kbSearch" style="padding-left:36px" placeholder="Search academic documents..." />
              </div>
              <div class="es-scroll-y mt-2" id="kbList" style="max-height:200px"></div>
            </div>

            <div class="es-card">
              <div class="d-flex align-items-center mb-2">
                <div class="es-card-title mb-0 me-auto"><i class="bi bi-calendar3"></i> Academic Dates</div>
                <button class="es-icon-btn" style="width:34px;height:34px" id="extractDates" title="Re-extract from documents"><i class="bi bi-magic"></i></button>
              </div>
              <div id="dateList"></div>
            </div>
          </div>
        </div>

        <!-- Calendar events -->
        <div class="es-card mt-3">
          <div class="d-flex align-items-center mb-2">
            <div class="es-card-title mb-0 me-auto"><i class="bi bi-calendar-event-fill"></i> Academic Calendar</div>
            <button class="btn-es-ghost btn-sm" id="addEvent"><i class="bi bi-plus-lg me-1"></i> Add event</button>
          </div>
          <div class="table-responsive">
            <table class="es-table">
              <thead><tr><th>Date</th><th>Event</th><th>Type</th><th>Reminder</th><th class="text-end">Actions</th></tr></thead>
              <tbody id="calBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/assistant.js"></script>
</body>
</html>
