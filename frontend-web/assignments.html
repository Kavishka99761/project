<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDU-SMART · Assignment Risk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" /> <!--add css file>
</head>
<body>
  <div class="es-app">
    <aside class="es-sidebar" id="esSidebar"></aside>
    <div class="es-sidebar-backdrop" id="esBackdrop"></div>
    <div class="es-main">
      <header class="es-topbar" id="esTopbar"></header>
      <main class="es-content">

        <section class="es-module-hero hero-jithmi es-fade-in">
          <div class="es-hero-icon"><i class="bi bi-clipboard2-pulse-fill"></i></div>
          <h1>Assignment Risk Dashboard</h1>
          <p>Predict deadline risk, prioritise workload and know exactly what to do first. Owner: Jithmi.</p>
        </section>

        <!-- Stats -->
        <div class="row g-3 mb-3" id="statRow"></div>

        <div class="row g-3">
          <!-- Left -->
          <div class="col-lg-8">
            <div class="es-card mb-3">
              <div class="d-flex align-items-center mb-2">
                <div class="es-card-title mb-0 me-auto"><i class="bi bi-fire"></i> Today's Priority</div>
                <button class="btn-es-primary btn-sm" data-bs-toggle="modal" data-bs-target="#assignModal" id="addBtn"><i class="bi bi-plus-lg me-1"></i> Add Assignment</button>
              </div>
              <div id="priorityList"></div>
            </div>

            <div class="es-card">
              <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                <div class="es-card-title mb-0 me-auto"><i class="bi bi-list-task"></i> All Assignments</div>
                <div class="btn-group btn-group-sm" role="group" id="viewTabs">
                  <button class="btn btn-es-ghost active" data-view="upcoming">Upcoming</button>
                  <button class="btn btn-es-ghost" data-view="overdue">Overdue</button>
                  <button class="btn btn-es-ghost" data-view="completed">Completed</button>
                </div>
              </div>
              <div class="table-responsive">
                <table class="es-table">
                  <thead><tr><th>Assignment</th><th>Deadline</th><th>Progress</th><th>Risk</th><th class="text-end">Actions</th></tr></thead>
                  <tbody id="assignBody"></tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Right -->
          <div class="col-lg-4">
            <div class="es-card mb-3">
              <div class="es-card-title"><i class="bi bi-clipboard-data-fill"></i> Workload Analysis</div>
              <div id="workloadBox"></div>
            </div>

            <div class="es-card mb-3">
              <div class="es-card-title"><i class="bi bi-pie-chart-fill"></i> Risk Distribution</div>
              <canvas id="riskChart" height="180"></canvas>
            </div>

            <div class="es-card">
              <div class="es-card-title"><i class="bi bi-lightbulb-fill"></i> Recommendation</div>
              <div id="recommendBox"></div>
            </div>
          </div>
        </div>

        <!-- What-if scenario -->
        <div class="es-card mt-3">
          <div class="es-card-title"><i class="bi bi-sliders"></i> "What-if" Scenario Planner</div>
          <div class="row g-3 align-items-center">
            <div class="col-md-5">
              <label class="form-label small fw-semibold text-muted-es">If I study <span id="hrsLabel" class="fw-bold" style="color:var(--es-jithmi)">3</span> hours/day for the next week…</label>
              <input type="range" class="form-range" min="0" max="10" step="0.5" value="3" id="whatIfHours" />
            </div>
            <div class="col-md-7" id="whatIfResult"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add/Edit assignment modal -->
  <div class="modal fade" id="assignModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="background:var(--es-surface);color:var(--es-text);border-radius:var(--es-radius);border:1px solid var(--es-border)">
        <div class="modal-header" style="border-color:var(--es-border)">
          <h5 class="modal-title fw-bold" id="assignModalTitle"><i class="bi bi-clipboard-plus me-2" style="color:var(--es-jithmi)"></i>Add Assignment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="aId" />
          <div class="row g-2">
            <div class="col-12">
              <label class="form-label small fw-semibold text-muted-es">Title</label>
              <input class="es-input" id="aTitle" placeholder="e.g. Database Project" />
            </div>
            <div class="col-12">
              <label class="form-label small fw-semibold text-muted-es">Module</label>
              <select class="es-input" id="aModule"></select>
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold text-muted-es">Deadline</label>
              <input type="date" class="es-input" id="aDeadline" />
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold text-muted-es">Priority</label>
              <select class="es-input" id="aPriority"><option>Low</option><option>Medium</option><option selected>High</option></select>
            </div>
            <div class="col-4">
              <label class="form-label small fw-semibold text-muted-es">Est. hours</label>
              <input type="number" class="es-input" id="aEst" value="10" min="1" />
            </div>
            <div class="col-4">
              <label class="form-label small fw-semibold text-muted-es">Done hours</label>
              <input type="number" class="es-input" id="aDone" value="0" min="0" />
            </div>
            <div class="col-4">
              <label class="form-label small fw-semibold text-muted-es">Progress %</label>
              <input type="number" class="es-input" id="aProgress" value="0" min="0" max="100" />
            </div>
          </div>
        </div>
        <div class="modal-footer" style="border-color:var(--es-border)">
          <button class="btn-es-ghost" data-bs-dismiss="modal">Cancel</button>
          <button class="btn-es-primary" id="saveAssign"><i class="bi bi-check2 me-1"></i> Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/assignments.js"></script>
</body>
</html>
