<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDU-SMART · Calendar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="es-app">
    <aside class="es-sidebar" id="esSidebar"></aside>
    <div class="es-sidebar-backdrop" id="esBackdrop"></div>
    <div class="es-main">
      <header class="es-topbar" id="esTopbar"></header>
      <main class="es-content">
        <section class="es-module-hero hero-primary es-fade-in">
          <div class="es-hero-icon"><i class="bi bi-calendar3"></i></div>
          <h1>Academic Calendar</h1>
          <p>A shared Common Platform service — combines academic dates (Kavishka), assignment deadlines (Jithmi) and study sessions (Pasindu).</p>
        </section>

        <div class="es-card mb-3">
          <div class="d-flex align-items-center justify-content-between">
            <button class="es-icon-btn" id="prevMonth"><i class="bi bi-chevron-left"></i></button>
            <h4 class="fw-bold mb-0" id="calTitle"></h4>
            <button class="es-icon-btn" id="nextMonth"><i class="bi bi-chevron-right"></i></button>
          </div>
          <div class="d-flex flex-wrap gap-3 mt-3 small text-muted-es" id="legend">
            <span><i class="bi bi-circle-fill" style="color:var(--es-kavishka);font-size:.6rem"></i> Academic date</span>
            <span><i class="bi bi-circle-fill" style="color:var(--es-jithmi);font-size:.6rem"></i> Assignment deadline</span>
            <span><i class="bi bi-circle-fill" style="color:var(--es-pasindu);font-size:.6rem"></i> Study session</span>
          </div>
        </div>

        <div class="es-card">
          <div id="calGrid" class="row g-1"></div>
        </div>

        <div class="es-card mt-3">
          <div class="es-card-title"><i class="bi bi-list-ul"></i> Events this month</div>
          <div id="monthEvents"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/calendar.js"></script>
</body>
</html>
