<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDU-SMART · Profile &amp; Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
</head>
<body>
  <div class="es-app">
    <aside class="es-sidebar" id="esSidebar"></aside>
    <div class="es-sidebar-backdrop" id="esBackdrop"></div>
    <div class="es-main">
      <header class="es-topbar" id="esTopbar"></header>
      <main class="es-content">
        <div class="row g-3">
          <div class="col-lg-4">
            <div class="es-card text-center">
              <span class="es-avatar mx-auto mb-3" style="width:84px;height:84px;font-size:2rem" id="pAvatar"></span>
              <h4 class="fw-bold mb-0" id="pName"></h4>
              <p class="text-muted-es small mb-1" id="pEmail"></p>
              <p class="text-muted-es small mb-3" id="pProgram"></p>
              <span class="es-pill bg-soft-primary" id="pYear"></span>
              <div class="es-divider"></div>
              <div class="row text-center g-2" id="pQuickStats"></div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="es-card mb-3">
              <div class="es-card-title"><i class="bi bi-person-lines-fill"></i> Profile</div>
              <div class="row g-2">
                <div class="col-md-6"><label class="form-label small fw-semibold text-muted-es">Full name</label><input class="es-input" id="inName" /></div>
                <div class="col-md-6"><label class="form-label small fw-semibold text-muted-es">Email</label><input class="es-input" id="inEmail" /></div>
                <div class="col-md-6"><label class="form-label small fw-semibold text-muted-es">Programme</label><input class="es-input" id="inProgram" /></div>
                <div class="col-md-6"><label class="form-label small fw-semibold text-muted-es">Year / Semester</label><input class="es-input" id="inYear" /></div>
              </div>
              <button class="btn-es-primary mt-3" id="saveProfile"><i class="bi bi-check2 me-1"></i>Save profile</button>
            </div>

            <div class="es-card mb-3">
              <div class="es-card-title"><i class="bi bi-collection-fill"></i> My Modules</div>
              <div id="moduleChips" class="d-flex flex-wrap gap-2 mb-2"></div>
              <div class="d-flex gap-2">
                <input class="es-input" id="newModule" placeholder="Add module (e.g. CS305 — Networks)" />
                <button class="btn-es-ghost" id="addModule"><i class="bi bi-plus-lg"></i></button>
              </div>
            </div>

            <div class="es-card mb-3">
              <div class="es-card-title"><i class="bi bi-gear-fill"></i> Preferences</div>
              <div class="es-list-item"><span class="es-li-icon bg-soft-assistant"><i class="bi bi-moon-stars"></i></span>
                <div style="flex:1"><div class="es-li-title">Dark mode</div><div class="es-li-sub">Switch between light and dark themes</div></div>
                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="setDark" /></div></div>
              <div class="es-list-item"><span class="es-li-icon bg-soft-risk"><i class="bi bi-bell"></i></span>
                <div style="flex:1"><div class="es-li-title">Deadline notifications</div><div class="es-li-sub">Alerts from the Assignment Risk module</div></div>
                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="setNotif" checked /></div></div>
              <div class="es-list-item"><span class="es-li-icon bg-soft-study"><i class="bi bi-bullseye"></i></span>
                <div style="flex:1"><div class="es-li-title">Daily study target</div><div class="es-li-sub">Used by Study &amp; Productivity</div></div>
                <input type="number" class="es-input" id="setTarget" value="180" min="30" step="15" style="width:110px" /></div>
            </div>

            <div class="es-card">
              <div class="es-card-title"><i class="bi bi-hdd-network-fill"></i> Data &amp; Backup</div>
              <p class="text-muted-es small">Export a snapshot of all your EDU-SMART data (Common Services → Data export).</p>
              <div class="d-flex gap-2 flex-wrap">
                <button class="btn-es-ghost" id="exportJson"><i class="bi bi-filetype-json me-1"></i>Export JSON</button>
                <button class="btn-es-ghost" id="exportCsv"><i class="bi bi-filetype-csv me-1"></i>Export assignments (CSV)</button>
                <button class="btn-es-ghost" id="logoutBtn"><i class="bi bi-box-arrow-right me-1"></i>Log out</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/profile.js"></script>
</body>
</html>
